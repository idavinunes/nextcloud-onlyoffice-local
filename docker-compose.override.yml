services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.nc-app
    image: nextcloud:29-apache-smb

  cron:
    build:
      context: .
      dockerfile: Dockerfile.nc-app
    image: nextcloud:29-apache-smb

  # Serviço opcional para fulltextsearch (rede interna, sem portas expostas)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.4
    container_name: es-fulltext
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.name=es-fulltext
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - TZ=${TZ}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 1g
    volumes:
      - ${ES_DATA_VOLUME:-/data/nextcloud-onlyoffice/data/elasticsearch}:/usr/share/elasticsearch/data
    networks: [interna]
