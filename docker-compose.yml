services:
  # ------------------ NEXTCLOUD ------------------
  db:
    image: mariadb:10.11
    container_name: nc-db
    restart: always
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: ${NC_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${NC_DB_NAME}
      MYSQL_USER: ${NC_DB_USER}
      MYSQL_PASSWORD: ${NC_DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ${NC_DB_VOLUME}:/var/lib/mysql
    networks: [interna]

  redis:
    image: redis:7-alpine
    container_name: nc-redis
    restart: always
    environment:
      TZ: ${TZ}
    networks: [interna]

  app:
    image: ${NEXTCLOUD_IMAGE:-nextcloud:30-apache}
    container_name: nc-app
    restart: always
    ports:
      - "127.0.0.1:${NC_HTTP_PORT}:80"
    environment:
      TZ: ${TZ}
      MYSQL_HOST: db
      MYSQL_DATABASE: ${NC_DB_NAME}
      MYSQL_USER: ${NC_DB_USER}
      MYSQL_PASSWORD: ${NC_DB_PASSWORD}
      NEXTCLOUD_DATA_DIR: /var/www/html/data
      REDIS_HOST: redis
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-1G}

      # ✅ Opção A (ENV direto do Nextcloud) — útil para fresh installs
      OVERWRITECLIURL: ${NC_OVERWRITE_CLI_URL}
      OVERWRITEHOST: ${NC_OVERWRITE_HOST}
      OVERWRITEPROTOCOL: ${NC_OVERWRITE_PROTOCOL}

      # ✅ Variáveis que o bootstrap usa (Opção B — garantido)
      NC_OVERWRITE_CLI_URL: ${NC_OVERWRITE_CLI_URL}
      NC_OVERWRITE_HOST: ${NC_OVERWRITE_HOST}
      NC_OVERWRITE_PROTOCOL: ${NC_OVERWRITE_PROTOCOL}

      # OnlyOffice (opcional, mas útil para documentação e scripts)
      OO_PUBLIC_URL: ${OO_PUBLIC_URL}
      OO_INTERNAL_URL: ${OO_INTERNAL_URL}
      NC_INTERNAL_URL: ${NC_INTERNAL_URL}
      OO_JWT_SECRET: ${OO_JWT_SECRET}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-}

    volumes:
      - ${NC_APP_VOLUME}:/var/www/html
      - ${NC_DATA_VOLUME}:/var/www/html/data
      - ./scripts/nextcloud-bootstrap.sh:/bootstrap.sh:ro
      - ./overrides/php/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro

    depends_on: [db, redis, onlyoffice]
    networks: [interna]

    # ✅ Opção B: aplica as configs via occ automaticamente a cada start
    command: >
      bash -lc "
        echo '[nc] starting apache...' &&
        /entrypoint.sh apache2-foreground &
        echo '[nc] waiting a bit for nextcloud...' &&
        sleep 12 &&
        echo '[nc] running bootstrap...' &&
        /bootstrap.sh || true
        wait
      "

  cron:
    image: ${NEXTCLOUD_IMAGE:-nextcloud:30-apache}
    container_name: nc-cron
    restart: always
    environment:
      TZ: ${TZ}
    volumes:
      - ${NC_APP_VOLUME}:/var/www/html
      - ${NC_DATA_VOLUME}:/var/www/html/data
      - ./overrides/php/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
    entrypoint: /cron.sh
    depends_on: [app]
    networks: [interna]

  # ------------------ ONLYOFFICE ------------------
  oo-postgres:
    image: postgres:15
    container_name: oo-postgres
    restart: always
    environment:
      POSTGRES_DB: onlyoffice
      POSTGRES_USER: onlyoffice
      POSTGRES_PASSWORD: onlyoffice
      TZ: ${TZ}
    volumes:
      - ${OO_PG_VOLUME}:/var/lib/postgresql/data
    networks: [interna]

  oo-rabbitmq:
    image: rabbitmq:3
    container_name: oo-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: onlyoffice
      RABBITMQ_DEFAULT_PASS: onlyoffice
      TZ: ${TZ}
    networks: [interna]

  onlyoffice:
    image: ghcr.io/thomisus/onlyoffice-documentserver-unlimited:9.1.0
    container_name: onlyoffice-documentserver
    restart: always
    ports:
      - "127.0.0.1:${OO_HTTP_PORT}:80"
    environment:
      DB_TYPE: postgres
      DB_HOST: oo-postgres
      DB_PORT: 5432
      DB_NAME: onlyoffice
      DB_USER: onlyoffice
      DB_PWD: onlyoffice

      AMQP_URI: amqp://onlyoffice:onlyoffice@oo-rabbitmq:5672

      JWT_ENABLED: "true"
      JWT_SECRET: "${OO_JWT_SECRET}"
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"

      TZ: ${TZ}

    volumes:
      - ${OO_DATA_VOLUME}:/var/www/onlyoffice/Data
      - ${OO_LOGS_VOLUME}:/var/log/onlyoffice
      - ${OO_LIB_VOLUME}:/var/lib/onlyoffice

    depends_on: [oo-postgres, oo-rabbitmq]
    networks: [interna]

 # ------------------ CLOUDFLARE TUNNEL (opcional) ------------------
  cloudflared:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TOKEN}"]
    environment:
      - TZ=${TZ}
    depends_on: [app, onlyoffice]
    networks: [interna]

networks:
  interna:
    name: interna
    external: true
