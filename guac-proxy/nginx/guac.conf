server {
  listen 8081;
  server_name _;

  # Ajuste o destino conforme a instalação do Guacamole.
  # Se o Tomcat/Guacamole estiver no host, use host.docker.internal ou o IP do host.
  # Se estiver em outro contêiner na mesma rede interna, use http://<servico>:8080/guacamole/.
  proxy_read_timeout 3600;
  proxy_send_timeout 3600;

  location / {
    proxy_pass http://host.docker.internal:8080/guacamole/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Liberar embed em iframe apenas para o domínio do Nextcloud
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    add_header X-Frame-Options "" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://midia.agenciasaved.com.br" always;
  }
}
