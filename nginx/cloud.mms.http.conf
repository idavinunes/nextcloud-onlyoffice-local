server {
    listen 80;
    server_name cloud.mms;

    # Nextcloud: uploads grandes
    client_max_body_size 10G;
    client_body_timeout 3600s;
    proxy_read_timeout 3600s;

    # Segurança básica (sem TLS na borda, pois o TLS fica no Cloudflare)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Redireciona CalDAV/CardDAV
    location = /.well-known/carddav {
        return 301 https://$host/remote.php/dav;
    }
    location = /.well-known/caldav {
        return 301 https://$host/remote.php/dav;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Informamos ao Nextcloud que o cliente externo veio por HTTPS (terminado no Cloudflare)
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "for=$proxy_add_x_forwarded_for;host=$host;proto=https";

        proxy_buffering off;
        proxy_request_buffering off;
    }
}
